<title>Grand Order PvP Playtest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one Chaldea command console. Field on the left (enemy row over your row), log and details on the right; stacks on phones. */
:root {
  color-scheme: dark;
  --bg: #0c0c0d; --panel: #161617; --panel2: #202022; --line: #333336; --ink: #ececed; --muted: #9b9ba1;
  --gold: #d8b45f; --gold-ink: #1b1608;
  --buster: #d9573f; --arts: #3f7ad9; --quick: #3aa76a;
  --p0: #6fc3dc; --p1: #e09a6c; --neg: #e2737a; --pos: #84c79a;
  --f-display: 'Marcellus', 'Palatino Linotype', Georgia, serif;
  --f-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r: 10px;
  --icon-bg: #161617;
  --t-atk: #e0805a; --t-def: #6fa8e8; --t-np: #d8b45f; --t-crit: #f0d36b; --t-star: #f0c84a; --t-res: #8fd0c2; --t-heal: #7fd18f; --t-util: #b3a7e6; --t-charm: #f08fb8;
  --t-orange: #f0913a; --t-gold: #e9c04b; --t-purple: #b47ff0; --t-dpurple: #9a62e8; --t-blue: #4f93ec; --t-white: #eef0f6; --t-red: #e8524e; --t-yellow: #f2d548; --t-pink: #f49bcb; --t-silver: #c3cad8; --t-peri: #a3a9f5;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
#app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; max-width: 1400px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.02; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.15rem; }
h4 { margin: 14px 0 4px; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
p { margin: 0; }
.eyebrow { font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.hint { color: var(--muted); font-size: .9rem; }
button { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cls { font-family: var(--f-mono); font-size: .68rem; padding: 1px 5px; border-radius: 4px; background: var(--line); color: var(--ink); letter-spacing: .04em; }

/* Setup */
.setup { max-width: 760px; display: grid; gap: 22px; padding-top: 6vh; }
.lede { font-size: 1.08rem; max-width: 62ch; color: var(--ink); }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 24px; margin: 8px 0 0; border-top: 1px solid var(--line); padding-top: 18px; }
.rules dt { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.rules dd { margin: 3px 0 0; }

/* Draft */
.draft { display: grid; gap: 18px; }
.draft-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: end; }
.ribbon { display: flex; gap: 4px; flex-wrap: wrap; }
.rib { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; font-family: var(--f-mono); font-size: .75rem; border: 1px solid var(--line); color: var(--muted); }
.rib.p0 { color: var(--p0); } .rib.p1 { color: var(--p1); }
.rib.done { opacity: .35; } .rib.now { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.draft-grid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start; }
.teams { display: grid; gap: 14px; }
.teambox { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.teambox.active { border-color: var(--gold); }
.teambox header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.teambox.p0 h3 { color: var(--p0); } .teambox.p1 h3 { color: var(--p1); }
.meta { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.picks { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; font-size: .9rem; }
.picks li { display: flex; gap: 6px; align-items: center; }
.picks .r { margin-left: auto; color: var(--muted); font-size: .78rem; white-space: nowrap; }
.picks .empty { color: var(--muted); opacity: .6; border: 1px dashed var(--line); border-radius: 6px; padding: 3px 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.dsearch { position: relative; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dsearch input { flex: 1; min-width: 0; font: inherit; font-size: .95rem; padding: 10px 36px 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); }
.dsearch input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 30%, transparent); }
.dsearch input::-webkit-search-cancel-button { display: none; }
.dsearch .dclear { position: absolute; right: 92px; width: 26px; height: 26px; padding: 0; border-radius: 50%; font-size: .8rem; display: grid; place-items: center; }
.dmode { position: relative; flex: none; }
.dmodebtn { height: 42px; padding: 0 12px; border-radius: 10px; font-weight: 600; white-space: nowrap; background: var(--panel2); border: 1px solid var(--line); }
.dmodebtn[aria-expanded="true"], .dmodebtn:hover { border-color: var(--gold); color: var(--gold); }
.dmenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 150px; display: grid; padding: 5px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,.45); }
.dmenu button { text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 7px; }
.dmenu button:hover { background: var(--panel2); }
.dmenu button.on { color: var(--gold); font-weight: 600; }
.dmenu button.on::after { content: ' ✓'; }
.tile .tmatch { display: block; margin-top: 4px; font-size: .72rem; color: var(--gold); line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.dsearch .dcount { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); width: 72px; text-align: right; }
.chip { padding: 5px 10px; font-size: .82rem; border-radius: 999px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { text-align: left; display: grid; gap: 4px; padding: 9px 10px; background: var(--panel); }
.tile.taken { opacity: .25; }
.tile.blocked { opacity: .55; }
.tile.focus { border-color: var(--gold); }
.tile.meta { border-color: var(--t-yellow); box-shadow: inset 0 0 0 1px var(--t-yellow); }
.tile.meta.focus { box-shadow: inset 0 0 0 1px var(--t-yellow), 0 0 0 2px var(--gold); }
.trole { font-size: .68rem; letter-spacing: .04em; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.trole .mtag, .roletag.meta { color: #1a1500; background: var(--t-yellow); border-radius: 999px; padding: 0 6px; font-weight: 700; }
.roletag { display: inline-block; font-size: .72rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); background: var(--panel2); vertical-align: middle; margin-right: 4px; }
.roletag.r-main { border-color: var(--buster); } .roletag.r-sub { border-color: var(--t-orange); } .roletag.r-heal { border-color: var(--t-heal); } .roletag.r-util { border-color: var(--arts); }
.roles { margin: 2px 0 8px; }
.chip.metachip.on { background: var(--t-yellow); color: #1a1500; border-color: var(--t-yellow); } .chip.metachip { border-color: var(--t-yellow); }
.tid { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); }
.tname { font-weight: 600; font-size: .9rem; line-height: 1.2; }
.tmeta { display: flex; gap: 6px; align-items: center; font-size: .78rem; color: var(--muted); }
.tmeta .cost { margin-left: auto; font-family: var(--f-mono); color: var(--gold); }
.tdeck { display: flex; gap: 2px; align-items: center; }
.dk, .npc { font-style: normal; font-family: var(--f-mono); font-size: .66rem; width: 15px; height: 17px; display: inline-grid; place-items: center; border-radius: 3px; color: #fff; }
.dk.B, .npc.B { background: var(--buster); } .dk.A, .npc.A { background: var(--arts); } .dk.Q, .npc.Q { background: var(--quick); }
.npc { margin-left: 6px; outline: 1px solid var(--gold); }
.detail { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; max-height: calc(100vh - 40px); overflow: auto; }
.sdetail h3 { font-size: 1.35rem; }
.stats { display: grid; grid-template-columns: repeat(5, auto); gap: 4px 14px; margin: 10px 0; }
@media (max-width: 480px) { .stats { grid-template-columns: repeat(3, auto); } }
.stats dt { font-size: .7rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.stats dd { margin: 0; font-family: var(--f-mono); font-size: .88rem; }
.traits { font-size: .8rem; color: var(--muted); }
.hitrow { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin: 2px 0 10px; }
.hitlbl { font-size: .7rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-right: 4px; }
.hitchip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-mono); font-size: .78rem; padding: 2px 7px 2px 3px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); }
.hitchip b { display: inline-grid; place-items: center; min-width: 20px; height: 18px; padding: 0 3px; border-radius: 4px; font-size: .66rem; color: #fff; background: var(--muted); }
.hitchip.Q b { background: var(--quick); } .hitchip.A b { background: var(--arts); } .hitchip.B b { background: var(--buster); }
.hitchip.EX b { background: #8b7cc8; } .hitchip.NP b { background: var(--gold); color: var(--gold-ink); }
.hitchip.NP.B b { background: var(--buster); color: #fff; } .hitchip.NP.A b { background: var(--arts); color: #fff; } .hitchip.NP.Q b { background: var(--quick); color: #fff; }
.sdetail p, .sk { font-size: .86rem; }
.sk { padding-left: 18px; margin: 0; display: grid; gap: 4px; }
/* kit descriptions */
.sdetail h4 { margin: 12px 0 6px; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.kskills { display: grid; gap: 8px; }
.kcard { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--panel2); }
.kcard.np { border-left: 4px solid var(--gold); } .kcard.np.B { border-left-color: var(--buster); } .kcard.np.A { border-left-color: var(--arts); } .kcard.np.Q { border-left-color: var(--quick); }
.khead { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 5px; }
.khead b { font-size: .92rem; margin-right: auto; }
.khead .badge, .khead .ico { flex: none; }
.kpill { font-family: var(--f-mono); font-size: .68rem; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.kpill.B { color: #fff; background: var(--buster); border-color: transparent; } .kpill.A { color: #fff; background: var(--arts); border-color: transparent; } .kpill.Q { color: #fff; background: var(--quick); border-color: transparent; }
.klines { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.klines li { position: relative; padding-left: 12px; font-size: .84rem; line-height: 1.35; }
.klines li::before { content: ''; position: absolute; left: 1px; top: .55em; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
.klines .klines { margin-top: 4px; padding-left: 4px; border-left: 2px solid var(--line); }
.klines .klines li::before { background: var(--muted); }
.kw { font-weight: 600; }
.km { display: block; font-size: .76rem; color: var(--muted); }
.koc { margin: 8px 0 4px; font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
.koc small { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
#tip { white-space: pre-line; }
/* servant info pop-up */
.modal-back { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .62); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px; animation: mfade .16s ease-out; }
.modal { position: relative; width: min(560px, 100%); max-height: min(88vh, 900px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 70px rgba(0, 0, 0, .55); animation: mpop .2s cubic-bezier(.2,.8,.3,1); }
.modal-body { overflow-y: auto; padding: 18px 20px 16px; overscroll-behavior: contain; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); border-radius: 0 0 16px 16px; }
.modal-foot .primary { flex: 1; max-width: 340px; }
.modal-x { position: absolute; top: 10px; right: 10px; z-index: 2; width: 34px; height: 34px; padding: 0; display: grid; place-items: center; border-radius: 50%; font-size: 1rem; line-height: 1; background: var(--panel2); border: 1px solid var(--line); }
.modal-x:hover { border-color: var(--gold); color: var(--gold); }
.modal .sdetail h3 { padding-right: 40px; }
.fstatus { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); padding-right: 40px; }
.fbars { display: flex; gap: 18px; font-family: var(--f-mono); font-size: .85rem; margin: 4px 0 2px; }
.fstatus .effects { margin: 0; padding: 0; list-style: none; font-size: .82rem; display: grid; gap: 5px; }
.fstatus .effects li { display: flex; gap: 8px; align-items: center; }
.fstatus .effects small { color: var(--muted); } .fstatus .effects .neg { color: var(--neg); }
.cdlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: .82rem; }
.cdlist li { display: flex; align-items: center; gap: 8px; } .cdlist .cdname { flex: 1; } .cdlist .badge, .fstatus .effects .badge { flex: none; } .cdlist b { font-family: var(--f-mono); font-size: .76rem; color: var(--muted); }
@keyframes mfade { from { opacity: 0; } } @keyframes mpop { from { opacity: 0; transform: translateY(10px) scale(.98); } }
@media (prefers-reduced-motion: reduce) { .modal-back, .modal { animation: none; } }
@media (max-width: 560px) { .modal-back { padding: 10px; } .modal { max-height: 92vh; } .modal-body { padding: 16px 14px 12px; } }

/* Lineup */
.lineup { display: grid; gap: 14px; max-width: 900px; }
.lineup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.lslot { text-align: left; display: grid; gap: 4px; padding: 12px; background: var(--panel); }
.lslot.set { border-color: var(--gold); }
.lnum { font-family: var(--f-mono); font-size: .74rem; color: var(--gold); }

/* Icons */
.ico { width: 100%; height: 100%; display: block; }
.clsico { width: 20px; height: 20px; flex: none; display: inline-grid; place-items: center; padding: 2px; border-radius: 5px; background: var(--line); color: var(--ink); --icon-bg: var(--line); }
.badge { position: relative; width: 24px; height: 24px; flex: none; display: inline-grid; place-items: center; padding: 3px; border-radius: 6px; background: var(--panel2); border: 1px solid currentColor; color: var(--t-util); --icon-bg: var(--panel2); cursor: help; }
.badge.sm { width: 18px; height: 18px; padding: 2px; border-radius: 4px; }
.badge.lg { width: 30px; height: 30px; padding: 4px; }
.badge.t-atk { color: var(--t-atk); } .badge.t-def { color: var(--t-def); } .badge.t-np { color: var(--t-np); } .badge.t-crit { color: var(--t-crit); }
.badge.t-star { color: var(--t-star); } .badge.t-res { color: var(--t-res); } .badge.t-heal { color: var(--t-heal); } .badge.t-util { color: var(--t-util); } .badge.t-charm { color: var(--t-charm); }
.badge.t-robin { color: #5aa9ff; background: rgba(90, 169, 255, .14); }
.badge.t-orange { color: var(--t-orange); } .badge.t-gold { color: var(--t-gold); } .badge.t-purple { color: var(--t-purple); } .badge.t-dpurple { color: var(--t-dpurple); } .badge.t-blue { color: var(--t-blue); }
.badge.t-white { color: var(--t-white); } .badge.t-red { color: var(--t-red); } .badge.t-yellow { color: var(--t-yellow); } .badge.t-pink { color: var(--t-pink); } .badge.t-silver { color: var(--t-silver); } .badge.t-peri { color: var(--t-peri); }
.badge.t-B { color: var(--buster); } .badge.t-A { color: var(--arts); } .badge.t-Q { color: var(--quick); } .badge.t-EX { color: var(--ink); }
.badge.t-bad { color: var(--neg); --icon-bg: color-mix(in srgb, var(--neg) 12%, var(--panel2)); background: var(--icon-bg); }
.badge.neg { border-color: var(--neg); --icon-bg: color-mix(in srgb, var(--neg) 16%, var(--panel2)); background: var(--icon-bg); }
.badge.neg.t-B, .badge.neg.t-A, .badge.neg.t-Q { background: rgba(226, 115, 122, .12); }
.arr { position: absolute; right: -4px; bottom: -5px; font-size: 9px; line-height: 1; padding: 1px 2px; border-radius: 3px; background: var(--bg); }
.arr.up { color: var(--pos); } .arr.down { color: var(--neg); }
.badge:focus-visible, .usedsk:focus-visible, .logic:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
#tip { position: fixed; z-index: 40; background: var(--ink); color: var(--bg); font-size: .8rem; line-height: 1.35; padding: 7px 10px; border-radius: 7px; box-shadow: 0 6px 24px rgba(0, 0, 0, .45); pointer-events: none; }

/* Battle: Player 1 left, Player 2 right, actions and log in the middle */
.battle { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: grid; gap: 12px; min-width: 0; }
.siderow { display: grid; gap: 8px; }
.sidelabel { display: flex; justify-content: space-between; gap: 10px; font-size: .82rem; color: var(--muted); }
.siderow.p0 .sidelabel b { color: var(--p0); } .siderow.p1 .sidelabel b { color: var(--p1); }
.units { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.unit { text-align: left; display: grid; gap: 3px; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; align-content: start; cursor: pointer; }
.unit:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.unit.p0 { border-top: 3px solid var(--p0); } .unit.p1 { border-top: 3px solid var(--p1); }
.unit.dead { opacity: .3; }
.unit.targetable { box-shadow: 0 0 0 2px var(--gold) inset; }
/* class affinity while picking a card target: red = super effective, blue = resisted, white = neutral */
.unit.targetable.aff-up { box-shadow: 0 0 0 3px #e5484d inset, 0 0 14px rgba(229,72,77,.45); }
.unit.targetable.aff-down { box-shadow: 0 0 0 3px #3e8bff inset, 0 0 14px rgba(62,139,255,.4); }
.unit.targetable.aff-even { box-shadow: 0 0 0 3px #ffffff inset, 0 0 12px rgba(255,255,255,.25); }
.afftag { margin-left: auto; flex: none; font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; }
.afftag.up { background: #e5484d; color: #fff; } .afftag.down { background: #3e8bff; color: #fff; } .afftag.even { background: #fff; color: #111; }
.chartbtn { font-size: .72rem; padding: 3px 9px; }
.modal:has(.afftable) { width: min(980px, 100%); }
.unit.selected { background: var(--panel2); box-shadow: 0 0 0 2px var(--gold) inset; }
.uhead { display: flex; gap: 6px; align-items: center; min-width: 0; }
.uname { font-weight: 700; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fulll { flex: none; font-size: .66rem; font-weight: 700; padding: 0 6px; border-radius: 999px; background: color-mix(in srgb, #e8b04a 22%, transparent); color: #f3d38c; cursor: help; }
.sgtag { display: inline-block; vertical-align: middle; font-family: var(--f-body); font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, #9c6bff 25%, transparent); color: #d7c4ff; }
