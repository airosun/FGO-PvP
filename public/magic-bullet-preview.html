<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Icon Sheet</title>
<style>
:root { color-scheme: dark; --bg: #0c0c0d; --panel: #161617; --line: #333336; --ink: #ececed; --muted: #9b9ba1; --gold: #d8b45f; --icon-bg: #161617; --buster: #d9573f; --arts: #3f7ad9; --quick: #3aa76a; --t-atk: #e0805a; --t-def: #6fa8e8; --t-np: #d8b45f; --t-crit: #f0d36b; --t-star: #f0c84a; --t-res: #8fd0c2; --t-heal: #7fd18f; --t-util: #b3a7e6; --t-charm: #f08fb8; --t-orange: #f0913a; --t-gold: #e9c04b; --t-purple: #b47ff0; --t-dpurple: #9a62e8; --t-blue: #4f93ec; --t-white: #eef0f6; --t-red: #e8524e; --t-yellow: #f2d548; --t-pink: #f49bcb; --t-silver: #c3cad8; --t-peri: #a3a9f5; }
* { box-sizing: border-box; }
body { min-height: 100vh; margin: 0; padding: 28px clamp(16px, 4vw, 48px) 48px; background: radial-gradient(ellipse at 50% 0, #1d2730 0, var(--bg) 48%); color: var(--ink); font: 14px/1.45 'Segoe UI', sans-serif; }
main { max-width: 1440px; margin: 0 auto; }
.eyebrow { margin: 0 0 8px; color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
h1 { margin: 0; font: 400 32px/1.2 Georgia, serif; }
.sub { margin: 8px 0 24px; color: var(--muted); }
.toolbar { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; padding: 12px 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); }
input { width: min(440px, 100%); height: 42px; padding: 0 12px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }
h2 { margin: 26px 0 10px; font-size: 15px; font-weight: 600; }
.sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 1px; overflow: hidden; border: 1px solid var(--line); background: var(--line); border-radius: 6px; }
.cell { min-width: 0; min-height: 110px; padding: 12px 8px 9px; background: var(--panel); display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: center; gap: 8px; }
.icon { display: grid; place-items: center; width: 44px; height: 44px; line-height: 0; }
.icon svg { display: block; width: 28px; height: 28px; overflow: visible; }
.icon.effect .badge { width: 34px; height: 34px; padding: 4px; line-height: 0; }
.icon.effect .badge svg { width: 100%; height: 100%; }
.icon.class .clsico { display: grid; place-items: center; width: 34px; height: 34px; padding: 2px; border-radius: 6px; background: #333336; color: var(--ink); --icon-bg: #333336; }
.icon.class svg { width: 100%; height: 100%; }
.badge { display: grid; place-items: center; width: 24px; height: 24px; padding: 3px; border-radius: 6px; background: #202022; border: 1px solid currentColor; color: var(--t-util); --icon-bg: #202022; }
.badge.t-atk { color: var(--t-atk); } .badge.t-def { color: var(--t-def); } .badge.t-np { color: var(--t-np); } .badge.t-crit { color: var(--t-crit); }
.badge.t-star { color: var(--t-star); } .badge.t-res { color: var(--t-res); } .badge.t-heal { color: var(--t-heal); } .badge.t-util { color: var(--t-util); } .badge.t-charm { color: var(--t-charm); }
.badge.t-robin { color: #5aa9ff; background: rgba(90, 169, 255, .14); }
.badge.t-orange { color: var(--t-orange); } .badge.t-gold { color: var(--t-gold); } .badge.t-purple { color: var(--t-purple); } .badge.t-dpurple { color: var(--t-dpurple); } .badge.t-blue { color: var(--t-blue); }
.badge.t-white { color: var(--t-white); } .badge.t-red { color: var(--t-red); } .badge.t-yellow { color: var(--t-yellow); } .badge.t-pink { color: var(--t-pink); } .badge.t-silver { color: var(--t-silver); } .badge.t-peri { color: var(--t-peri); }
.badge.t-B { color: var(--buster); } .badge.t-A { color: var(--arts); } .badge.t-Q { color: var(--quick); } .badge.t-EX { color: var(--ink); }
.badge.t-bad { color: #e2737a; }
.name { width: 100%; color: var(--muted); text-align: center; font: 10px/1.25 Consolas, monospace; overflow-wrap: anywhere; }
.empty { display: none; }
@media (max-width: 520px) { .sheet { grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); } .cell { min-height: 96px; } }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Grand Order PvP · Icon inventory</p>
  <h1>Game icon sheet</h1>
  <p class="sub">Effect badges, class marks, and every standalone glyph. Colors match the game; only Magic Bullet has a cyan glow.</p>
  <div class="toolbar"><input id="filter" type="search" placeholder="Filter icons by name" aria-label="Filter icons by name"><span class="count" id="count"></span></div>
  <h2>Effect badges</h2><section class="sheet" id="effects" aria-label="Effect icons"></section>
  <h2>Classes</h2><section class="sheet" id="classes" aria-label="Class icons"></section>
  <h2>Standalone glyphs</h2><section class="sheet" id="glyphs" aria-label="Standalone icon glyphs"></section>
</main>
<script src="../src/icons.js"></script>
<script>
const effects = document.querySelector('#effects');
const classes = document.querySelector('#classes');
const glyphs = document.querySelector('#glyphs');
const title = name => name.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/([A-Z])([A-Z][a-z])/g, '$1 $2').replace(/\b[a-z]/g, c => c.toUpperCase());
function item(name, markup, section, extra = '') {
  const article = document.createElement('article');
  article.className = 'cell';
  article.dataset.search = `${title(name)} ${title(extra)}`.toLowerCase();
  article.innerHTML = `<span class="icon ${section}">${markup}</span><span class="name"></span>`;
  article.querySelector('.name').textContent = title(name);
  return article;
}
for (const [name, [glyph]] of Object.entries(Icons.EFFECT)) effects.append(item(name, Icons.badge(name, { plain: true }), 'effect', glyph));
for (const [name, glyph] of Object.entries(Icons.CLASS)) classes.append(item(name, Icons.classIcon(name), 'class', glyph));
const mapped = new Set([...Object.values(Icons.EFFECT).map(([glyph]) => glyph), ...Object.values(Icons.CLASS)]);
for (const glyph of Icons.glyphs) if (!mapped.has(glyph)) glyphs.append(item(glyph, Icons.svg(glyph), 'glyph'));
const filter = document.querySelector('#filter'), count = document.querySelector('#count');
function update() {
  const query = filter.value.trim().toLowerCase(); let shown = 0;
  document.querySelectorAll('.cell').forEach(cell => { const match = cell.dataset.search.includes(query); cell.classList.toggle('empty', !match); if (match) shown++; });
  count.textContent = `${shown} icons`;
}
filter.addEventListener('input', update);
update();
</script>
</body>
</html>
